<section id="console" class="console" aria-labelledby="console-title">
  <header class="console-head">
    <h2 id="console-title">Salvage drone console</h2>
    <p id="drone-status" class="status" aria-live="polite">Idle</p>
  </header>

  <form id="cmd-form" class="cmd" autocomplete="off">
    <label for="cmd">Command</label>
    <input id="cmd" name="cmd" placeholder="scan, spin, color, help" spellcheck="false" title="Type a command and press Enter">
    <button type="submit" class="btn" title="Run the command (Enter)">Send</button>
  </form>

  <div class="row">
    <!-- Native tooltips on a perspective-projected panel: the browser positions them from the reported geometry. -->
    <button type="button" class="btn" data-action="spin" aria-pressed="true" title="Toggle debris rotation. aria-pressed exposes the on/off state.">Spin</button>
    <button type="button" class="btn" data-action="color" title="Give every cube a new random color">Random color</button>
    <label class="check" title="Switches the scene's directional light"><input type="checkbox" id="lights" name="lights" checked> Lights</label>
  </div>

  <ol id="log" class="log" aria-label="Console log" reversed></ol>
</section>
