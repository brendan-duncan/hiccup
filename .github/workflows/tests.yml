# Runs the package's edit-mode and play-mode tests on every push and pull request.
#
# One-time setup, which only a repository admin can do: Unity on CI needs a license. Add these repository
# secrets (Settings > Secrets and variables > Actions), following https://game.ci/docs/github/activation:
#   UNITY_LICENSE   the contents of a Unity license file (.ulf), for a personal license
#   UNITY_EMAIL     the Unity account e-mail
#   UNITY_PASSWORD  the Unity account password
# Without them the job fails at activation.
#
# The play-mode tests drive the Editor preview, which needs Chrome. The game-ci images do not ship one, so those
# tests report as ignored there; they still run locally. To run them on CI too, switch to an image with Chrome
# installed (the `customImage` input) or add an apt-get step before the runner.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: ${{ matrix.testMode }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        testMode: [EditMode, PlayMode]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.testMode }}-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-${{ matrix.testMode }}-
            Library-

      - uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          # Read from ProjectSettings/ProjectVersion.txt; the matching game-ci image must exist on Docker Hub.
          unityVersion: auto
          testMode: ${{ matrix.testMode }}
          # Only the package's own assemblies; the samples have no tests.
          testCategory: ''
          artifactsPath: test-results-${{ matrix.testMode }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: ${{ matrix.testMode }} results

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.testMode }}
          path: ${{ steps.tests.outputs.artifactsPath }}
